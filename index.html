<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lua Script Manager</title>
<style>
body {
    font-family: sans-serif;
    background: #1e1e2f;
    color: #eee;
    margin: 0; padding: 0;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
}
.container {
    width: 100%; max-width: 700px;
    background: #2a2a3d;
    padding: 30px;
    border-radius: 15px;
}
h1 {
    text-align: center;
    margin-bottom: 20px;
    font-size: 2em;
}
.tabs {
    display: flex; margin-bottom: 20px;
}
.tab {
    flex: 1; padding: 10px; text-align: center;
    cursor: pointer; background: #3a3a4d; margin-right: 5px;
    border-radius: 8px; user-select: none;
}
.tab:last-child { margin-right: 0; }
.tab.active { background: #667eea; color: #fff; }
.panel { display: none; }
.panel.active { display: block; }
.form-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 5px; }
input, textarea {
    width: 100%; padding: 10px;
    border-radius: 6px; border: none;
    background: #1f1f2d; color: #eee;
    font-family: monospace;
}
textarea { resize: vertical; min-height: 120px; }
button {
    padding: 10px; border: none; border-radius: 6px;
    background: #667eea; color: #fff; cursor: pointer;
}
button.secondary { background: #555; margin-left: 5px; }
.result {
    margin-top: 15px;
    padding: 10px;
    background: #1f1f2d;
    border-left: 4px solid #667eea;
    word-break: break-word;
}
.result.error { border-left-color: #ff6b6b; color: #ffb3b3; }
.result.success { border-left-color: #4caf50; }
.copy-btn { margin-top: 8px; padding: 5px 10px; cursor: pointer; background:#444; color:#eee; border:none; border-radius:4px; }
.copy-btn:hover { background:#555; }
</style>
</head>
<body>
<div class="container">
    <h1>Lua Script Manager</h1>
    <div class="tabs">
        <div class="tab active" onclick="switchTab('create')">Create</div>
        <div class="tab" onclick="switchTab('edit')">Edit</div>
    </div>

    <div id="create-panel" class="panel active">
        <div class="form-group">
            <label>Script Name</label>
            <input type="text" id="create-name">
        </div>
        <div class="form-group">
            <label>Lua Script</label>
            <textarea id="create-script">print("Hello!")</textarea>
        </div>
        <div class="form-group">
            <label>Key</label>
            <input type="text" id="create-key">
        </div>
        <button onclick="createScript()">Create</button>
        <div id="create-result" class="result" style="display:none;"></div>
    </div>

    <div id="edit-panel" class="panel">
        <div class="form-group">
            <label>Script ID</label>
            <input type="text" id="edit-id">
        </div>
        <div class="form-group">
            <label>Key</label>
            <input type="text" id="edit-key">
        </div>
        <button onclick="loadScript()">Load</button>
        <button onclick="getMainLoader()" class="secondary">Get Loader</button>

        <div id="edit-form" style="display:none; margin-top:15px;">
            <div class="form-group">
                <label>Edit Script</label>
                <textarea id="edit-script"></textarea>
            </div>
            <button onclick="saveScript()">Save</button>
            <button onclick="getMainLoader()" class="secondary">Get Loader</button>
            <div id="edit-result" class="result" style="display:none;"></div>
        </div>
    </div>
</div>

<script>
const BASE_URL = 'http://localhost:3000';

function switchTab(tab){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.querySelector(`.tab:contains("${tab==='create'?'Create':'Edit'}")`).classList.add('active');
    document.getElementById(`${tab}-panel`).classList.add('active');
}

// --- JS fungsi create, load, save, loader sama persis seperti sebelumnya
// Bisa pakai yang sudah ada, tidak perlu diubah

</script>
</body>
</html>
