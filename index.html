<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lua Script Cloud · Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0b1a24 0%, #1c2f3f 100%);
      min-height: 100vh;
      color: #eef4f8;
      padding: 2rem 1.5rem;
    }

    .glass {
      background: rgba(20, 35, 45, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 28px;
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.5);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo h1 {
      font-weight: 600;
      font-size: 1.9rem;
      letter-spacing: -0.5px;
      background: linear-gradient(130deg, #b0d4f0, #80b5e0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
    }

    .badge {
      background: rgba(72, 140, 200, 0.2);
      padding: 0.5rem 1.2rem;
      border-radius: 60px;
      font-size: 0.9rem;
      border: 1px solid rgba(100, 170, 240, 0.3);
      color: #b3defa;
    }

    /* stat cards */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 1.2rem;
      margin-bottom: 2.2rem;
    }

    .stat-card {
      background: rgba(12, 28, 40, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 1.3rem 1.2rem;
      border: 1px solid rgba(90, 150, 200, 0.15);
      box-shadow: 0 8px 20px -10px #00000055;
    }

    .stat-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #9bbdd5;
      margin-bottom: 0.4rem;
    }

    .stat-value {
      font-size: 2.4rem;
      font-weight: 600;
      line-height: 1;
      color: white;
    }

    /* tabs */
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.8rem;
      background: rgba(0, 0, 0, 0.2);
      padding: 0.4rem;
      border-radius: 40px;
      width: fit-content;
      backdrop-filter: blur(4px);
    }

    .tab {
      padding: 0.7rem 2rem;
      border-radius: 30px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      color: #bbd6ee;
      border: 1px solid transparent;
    }

    .tab.active {
      background: #2f5570;
      color: white;
      box-shadow: 0 6px 14px rgba(0, 40, 60, 0.6);
      border-color: #3f779b;
    }

    /* panels */
    .panel {
      display: none;
      animation: fade 0.25s ease;
    }

    .panel.active {
      display: block;
    }

    @keyframes fade { from { opacity: 0.3; } to { opacity: 1; } }

    /* form */
    .form-group {
      margin-bottom: 1.6rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: #c5dff5;
    }

    input, textarea {
      width: 100%;
      background: #10232f;
      border: 1px solid #2f4d64;
      border-radius: 18px;
      padding: 0.9rem 1.2rem;
      color: white;
      font-size: 1rem;
      transition: 0.2s;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: #5c9fd4;
      box-shadow: 0 0 0 3px rgba(80, 160, 240, 0.2);
    }

    textarea {
      resize: vertical;
      min-height: 150px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }

    button {
      background: #2a5f85;
      border: none;
      border-radius: 40px;
      padding: 0.9rem 2rem;
      font-weight: 600;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.15s;
      border: 1px solid #3d7aa8;
      box-shadow: 0 6px 14px rgba(0, 40, 60, 0.4);
    }

    button:hover {
      background: #3275a2;
      transform: scale(1.02);
    }

    button.secondary {
      background: transparent;
      border: 1px solid #457b9d;
      color: #cbe5fe;
      box-shadow: none;
    }

    button.secondary:hover {
      background: #1f435a;
    }

    .loader-box {
      background: #0b1c28;
      border-radius: 24px;
      padding: 1.2rem;
      margin: 1.8rem 0 0.5rem;
      border: 1px solid #2f5777;
      word-break: break-all;
      font-family: monospace;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .copy-btn {
      background: #1d3e55;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      font-size: 0.8rem;
      border: 1px solid #2f6991;
      cursor: pointer;
      transition: 0.1s;
      white-space: nowrap;
    }

    .copy-btn:hover {
      background: #275c7a;
    }

    .script-list {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .script-item {
      background: rgba(15, 33, 48, 0.8);
      backdrop-filter: blur(4px);
      border-radius: 24px;
      padding: 1.2rem 1.5rem;
      border: 1px solid #284b64;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .script-info h3 {
      font-weight: 500;
      font-size: 1.3rem;
      margin-bottom: 0.2rem;
    }

    .script-info small {
      color: #8db3d0;
    }

    .script-actions {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .badge-sm {
      background: #1b3d52;
      border-radius: 30px;
      padding: 0.2rem 1rem;
      font-size: 0.8rem;
      border: 1px solid #346180;
    }

    /* modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      background: #153544;
      border-radius: 32px;
      max-width: 550px;
      width: 90%;
      padding: 2rem;
      border: 1px solid #3f6f93;
      box-shadow: 0 30px 60px #00000080;
    }

    .modal h2 {
      margin-top: 0;
      margin-bottom: 1.5rem;
    }

    .close-modal {
      float: right;
      font-size: 1.6rem;
      cursor: pointer;
      color: #b0cde0;
    }
  </style>
</head>
<body>
<div class="container">
  <!-- header -->
  <div class="header">
    <div class="logo">
      <h1>◈ LuaCloud</h1>
    </div>
    <div class="badge">
      ⚡ Railway · MongoDB
    </div>
  </div>

  <!-- stats cards -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Total Scripts</div>
      <div class="stat-value" id="scriptCount">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Status</div>
      <div class="stat-value" style="font-size:1.8rem;">🟢 Online</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Endpoint</div>
      <div class="stat-value" style="font-size:1rem; word-break:break-all;">/create<br>/loader/:name</div>
    </div>
  </div>

  <!-- tabs -->
  <div class="tabs">
    <div class="tab active" data-tab="create">➕ Create</div>
    <div class="tab" data-tab="scripts">📜 My Scripts</div>
  </div>

  <!-- panel create -->
  <div id="createPanel" class="panel active">
    <div class="glass" style="padding: 2rem;">
      <div class="form-group">
        <label>Script Name (unique)</label>
        <input type="text" id="scriptName" placeholder="e.g. cool_script" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Lua Script</label>
        <textarea id="scriptCode" placeholder="-- your lua code here">print("Hello from Railway!")</textarea>
      </div>
      <div class="form-group">
        <label>Key (password for edit)</label>
        <input type="password" id="scriptKey" placeholder="minimal 4 characters" value="rahasia123">
      </div>
      <button id="createBtn">🚀 Create Script</button>
      <div id="createResult"></div>
    </div>
  </div>

  <!-- panel my scripts -->
  <div id="scriptsPanel" class="panel">
    <div class="glass" style="padding: 2rem;">
      <div style="margin-bottom: 1.2rem; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-weight: 600;">📋 Saved in browser</span>
        <button class="secondary" id="refreshListBtn" style="padding:0.4rem 1.2rem;">↻ Refresh</button>
      </div>
      <div id="scriptListContainer" class="script-list">
        <!-- akan diisi javascript -->
        <div style="text-align:center; padding: 3rem; color: #7f9fb5;">Belum ada script, buat dulu di tab Create.</div>
      </div>
    </div>
  </div>
</div>

<!-- modal edit -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <span class="close-modal" id="closeModalBtn">&times;</span>
    <h2>✎ Edit Script</h2>
    <div class="form-group">
      <label>Script Name</label>
      <input type="text" id="editName" readonly disabled style="background:#1e3a4c;">
    </div>
    <div class="form-group">
      <label>Lua Script</label>
      <textarea id="editCode" rows="8"></textarea>
    </div>
    <div class="form-group">
      <label>Key (required)</label>
      <input type="password" id="editKey" placeholder="masukkan key script ini">
    </div>
    <div style="display: flex; gap: 1rem; justify-content: flex-end;">
      <button class="secondary" id="cancelEditBtn">Cancel</button>
      <button id="saveEditBtn">💾 Update Script</button>
    </div>
    <div id="editStatus" style="margin-top: 1rem; font-size:0.9rem;"></div>
  </div>
</div>

<script>
  (function() {
    // ---------- CONFIG ----------
    const BASE_URL = 'https://xzuyaxserver.up.railway.app'; // ganti jika perlu

    // ---------- LOCAL STORAGE KEYS ----------
    const STORAGE_KEY = 'lua_scripts_list';

    // ---------- HELPER: load/save local scripts ----------
    function getLocalScripts() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveLocalScripts(scripts) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(scripts));
      updateStatsAndList();
    }

    // ---------- UI ELEMENTS ----------
    const createPanel = document.getElementById('createPanel');
    const scriptsPanel = document.getElementById('scriptsPanel');
    const tabs = document.querySelectorAll('.tab');
    const scriptNameIn = document.getElementById('scriptName');
    const scriptCodeIn = document.getElementById('scriptCode');
    const scriptKeyIn = document.getElementById('scriptKey');
    const createBtn = document.getElementById('createBtn');
    const createResult = document.getElementById('createResult');
    const scriptListContainer = document.getElementById('scriptListContainer');
    const scriptCountSpan = document.getElementById('scriptCount');
    const refreshBtn = document.getElementById('refreshListBtn');

    // modal elements
    const modalOverlay = document.getElementById('editModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const saveEditBtn = document.getElementById('saveEditBtn');
    const editName = document.getElementById('editName');
    const editCode = document.getElementById('editCode');
    const editKey = document.getElementById('editKey');
    const editStatus = document.getElementById('editStatus');

    let currentEditName = null; // menyimpan nama script yang sedang diedit

    // ---------- TAB SWITCHING ----------
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const target = tab.getAttribute('data-tab');
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        if (target === 'create') {
          createPanel.classList.add('active');
          scriptsPanel.classList.remove('active');
        } else {
          createPanel.classList.remove('active');
          scriptsPanel.classList.add('active');
          renderScriptList();
        }
      });
    });

    // ---------- RENDER SCRIPT LIST FROM LOCALSTORAGE ----------
    function renderScriptList() {
      const scripts = getLocalScripts();
      scriptCountSpan.innerText = scripts.length;

      if (scripts.length === 0) {
        scriptListContainer.innerHTML = '<div style="text-align:center; padding: 3rem; color: #7f9fb5;">📭 Belum ada script, buat dulu di tab Create.</div>';
        return;
      }

      let html = '';
      scripts.forEach(s => {
        const loader = `loadstring(game:HttpGet("${BASE_URL}/loader/${encodeURIComponent(s.name)}"))()`;
        html += `
          <div class="script-item" data-name="${s.name}">
            <div class="script-info">
              <h3>${escapeHtml(s.name)}</h3>
              <small>Key: •••••• (tersimpan)</small>
            </div>
            <div class="script-actions">
              <span class="badge-sm copy-btn" onclick="copyLoader('${encodeURIComponent(s.name)}', this)">📋 Copy Loader</span>
              <span class="badge-sm" style="background:#28536b;" onclick="openEditModal('${encodeURIComponent(s.name)}')">✎ Edit</span>
              <span class="badge-sm" style="background:#4f3b3b;" onclick="deleteLocalScript('${encodeURIComponent(s.name)}')">🗑 Hapus</span>
            </div>
          </div>
        `;
      });
      scriptListContainer.innerHTML = html;
    }

    // simple escape for innerHTML
    function escapeHtml(unsafe) {
      return unsafe.replace(/[&<>"']/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        return '&#039;';
      });
    }

    // ---------- COPY LOADER (global function dipanggil dari onclick) ----------
    window.copyLoader = function(encodedName, element) {
      const name = decodeURIComponent(encodedName);
      const loader = `loadstring(game:HttpGet("${BASE_URL}/loader/${encodeURIComponent(name)}"))()`;
      navigator.clipboard.writeText(loader).then(() => {
        const originalText = element.innerText;
        element.innerText = '✓ Copied!';
        setTimeout(() => element.innerText = originalText, 1500);
      }).catch(() => alert('Gagal copy, salin manual: ' + loader));
    };

    // ---------- DELETE LOCAL SCRIPT ----------
    window.deleteLocalScript = function(encodedName) {
      const name = decodeURIComponent(encodedName);
      if (!confirm(`Hapus script "${name}" dari daftar lokal? (tidak mempengaruhi server)`)) return;
      let scripts = getLocalScripts();
      scripts = scripts.filter(s => s.name !== name);
      saveLocalScripts(scripts);
      renderScriptList();
    };

    // ---------- OPEN EDIT MODAL ----------
    window.openEditModal = function(encodedName) {
      const name = decodeURIComponent(encodedName);
      const scripts = getLocalScripts();
      const script = scripts.find(s => s.name === name);
      if (!script) {
        alert('Script tidak ditemukan di penyimpanan lokal.');
        return;
      }
      currentEditName = name;
      editName.value = name;
      editCode.value = script.code || ''; // simpan juga code? kita perlu menyimpan code saat create
      editKey.value = ''; // kosong, user harus isi key
      editStatus.innerHTML = '';
      modalOverlay.style.display = 'flex';
    };

    // ---------- CLOSE MODAL ----------
    function closeModal() {
      modalOverlay.style.display = 'none';
      currentEditName = null;
      editKey.value = '';
      editStatus.innerHTML = '';
    }

    closeModalBtn.addEventListener('click', closeModal);
    cancelEditBtn.addEventListener('click', closeModal);
    window.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    // ---------- SAVE EDIT (UPDATE) ----------
    saveEditBtn.addEventListener('click', async () => {
      if (!currentEditName) return;
      const newCode = editCode.value.trim();
      const key = editKey.value.trim();
      if (!newCode) {
        editStatus.innerHTML = '<span style="color:#f99;">Script tidak boleh kosong</span>';
        return;
      }
      if (!key) {
        editStatus.innerHTML = '<span style="color:#f99;">Key harus diisi</span>';
        return;
      }

      saveEditBtn.disabled = true;
      editStatus.innerHTML = '<span>⏳ mengupdate...</span>';

      try {
        const res = await fetch(`${BASE_URL}/${encodeURIComponent(currentEditName)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ script: newCode, key: key })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          editStatus.innerHTML = '<span style="color:#8f8;">✅ Update berhasil!</span>';
          // perbarui localStorage
          let scripts = getLocalScripts();
          const idx = scripts.findIndex(s => s.name === currentEditName);
          if (idx !== -1) {
            scripts[idx].code = newCode;
            saveLocalScripts(scripts);
          }
          setTimeout(() => closeModal(), 1200);
        } else {
          editStatus.innerHTML = `<span style="color:#f99;">❌ Gagal: ${data.error || 'unknown'}</span>`;
        }
      } catch (err) {
        editStatus.innerHTML = `<span style="color:#f99;">❌ Error: ${err.message}</span>`;
      } finally {
        saveEditBtn.disabled = false;
      }
    });

    // ---------- CREATE SCRIPT ----------
    createBtn.addEventListener('click', async () => {
      const name = scriptNameIn.value.trim();
      const code = scriptCodeIn.value.trim();
      const key = scriptKeyIn.value.trim();

      if (!name || !code || !key) {
        createResult.innerHTML = '<div class="loader-box" style="color:#faa;">⚠️ Semua field harus diisi</div>';
        return;
      }

      createBtn.disabled = true;
      createResult.innerHTML = '<div class="loader-box">⏳ Menyimpan...</div>';

      try {
        const res = await fetch(`${BASE_URL}/create`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, script: code, key })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          const loader = `loadstring(game:HttpGet("${BASE_URL}/loader/${encodeURIComponent(name)}"))()`;
          createResult.innerHTML = `
            <div class="loader-box">
              <span style="font-family: monospace;">${loader}</span>
              <span class="copy-btn" onclick="copyText(this, '${loader.replace(/'/g, "\\'")}')">📋 Copy</span>
            </div>
            <small style="color:#8f8;">✅ Script tersimpan di server & daftar lokal</small>
          `;
          // simpan ke localStorage
          let scripts = getLocalScripts();
          // cek duplikat nama, hapus yang lama jika ada (seharusnya sudah unik di server)
          scripts = scripts.filter(s => s.name !== name);
          scripts.push({ name, code, key });
          saveLocalScripts(scripts);
          // reset form
          scriptNameIn.value = '';
          scriptCodeIn.value = 'print("Hello again!")';
          scriptKeyIn.value = 'rahasia123';
        } else {
          createResult.innerHTML = `<div class="loader-box" style="color:#faa;">❌ Error: ${data.error || 'Gagal'}</div>`;
        }
      } catch (err) {
        createResult.innerHTML = `<div class="loader-box" style="color:#faa;">❌ Network error: ${err.message}</div>`;
      } finally {
        createBtn.disabled = false;
      }
    });

    // copy text helper
    window.copyText = function(el, text) {
      navigator.clipboard.writeText(text).then(() => {
        const orig = el.innerText;
        el.innerText = 'Copied!';
        setTimeout(() => el.innerText = orig, 1500);
      }).catch(() => alert('Copy manual: ' + text));
    };

    // refresh list (panggil render ulang)
    refreshBtn.addEventListener('click', () => {
      renderScriptList();
    });

    // inisialisasi: render list saat pertama
    function updateStatsAndList() {
      const scripts = getLocalScripts();
      scriptCountSpan.innerText = scripts.length;
      // jika panel scripts sedang aktif, render ulang
      if (scriptsPanel.classList.contains('active')) {
        renderScriptList();
      }
    }

    // tambahan: agar tombol copy di loader hasil create juga berfungsi
    window.copyLoaderInline = function(btn, loader) {
      navigator.clipboard.writeText(loader).then(() => {
        btn.innerText = 'Copied!';
        setTimeout(() => btn.innerText = 'Copy', 1500);
      });
    };

    // jalankan di awal
    renderScriptList();
  })();
</script>
</body>
</html>
