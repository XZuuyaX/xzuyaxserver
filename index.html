<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lua Script Cloud Dashboard</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
min-height:100vh;
}

.container{
max-width:1100px;
margin:auto;
padding:30px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.title{
font-size:28px;
font-weight:bold;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(12px);
padding:20px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.card h3{
margin:0;
font-size:14px;
opacity:.7;
}

.card p{
font-size:26px;
margin:5px 0 0 0;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:20px;
}

.tab{
padding:10px 20px;
background:rgba(255,255,255,0.08);
border-radius:8px;
cursor:pointer;
}

.tab.active{
background:#5b7cff;
}

.panel{
display:none;
}

.panel.active{
display:block;
}

input,textarea{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:15px;
border:none;
border-radius:8px;
background:#111;
color:white;
}

textarea{
min-height:150px;
font-family:monospace;
}

button{
padding:12px 18px;
border:none;
border-radius:8px;
cursor:pointer;
background:#5b7cff;
color:white;
}

button.secondary{
background:#444;
}

.scriptList{
margin-top:20px;
}

.scriptItem{
background:rgba(255,255,255,0.05);
padding:15px;
border-radius:10px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.loaderBox{
background:#000;
padding:10px;
border-radius:8px;
margin-top:10px;
font-family:monospace;
word-break:break-all;
}

.copy{
background:#222;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
margin-left:10px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="title">🚀 Lua Script Cloud</div>
</div>

<div class="stats">

<div class="card">
<h3>Total Scripts</h3>
<p id="scriptCount">0</p>
</div>

<div class="card">
<h3>Server</h3>
<p>Online</p>
</div>

<div class="card">
<h3>Status</h3>
<p>Secure</p>
</div>

</div>

<div class="tabs">
<div class="tab active" onclick="tab('create')">Create</div>
<div class="tab" onclick="tab('scripts')">Scripts</div>
</div>

<div id="create" class="panel active">

<label>Script Name</label>
<input id="name">

<label>Lua Script</label>
<textarea id="code">print("Hello Executor")</textarea>

<button onclick="createScript()">Create Script</button>

<div id="createResult"></div>

</div>

<div id="scripts" class="panel">

<div id="scriptList" class="scriptList"></div>

</div>

</div>

<script>

const BASE_URL="https://xzuyaxserver.up.railway.app"

let scripts=[]

function tab(id){

document.querySelectorAll(".tab").forEach(e=>e.classList.remove("active"))
event.target.classList.add("active")

document.querySelectorAll(".panel").forEach(e=>e.classList.remove("active"))
document.getElementById(id).classList.add("active")

}

async function createScript(){

const name=document.getElementById("name").value
const code=document.getElementById("code").value

const res=await fetch(BASE_URL+"/scripts",{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({name,code})
})

const data=await res.json()

document.getElementById("createResult").innerHTML=`
<div class="loaderBox">
loadstring(game:HttpGet("${BASE_URL}/loader/${name}"))()
<span class="copy" onclick="copy(this)">Copy</span>
</div>
`

scripts.push(name)
updateList()

}

function updateList(){

const list=document.getElementById("scriptList")
list.innerHTML=""

scripts.forEach(name=>{

list.innerHTML+=`

<div class="scriptItem">

<div>

<b>${name}</b>

<div class="loaderBox">
loadstring(game:HttpGet("${BASE_URL}/loader/${name}"))()
<span class="copy" onclick="copy(this)">Copy</span>
</div>

</div>

<button onclick="deleteScript('${name}')">Delete</button>

</div>

`

})

document.getElementById("scriptCount").innerText=scripts.length

}

function copy(el){

const text=el.parentElement.innerText.replace("Copy","")

navigator.clipboard.writeText(text)

el.innerText="Copied"

setTimeout(()=>el.innerText="Copy",1500)

}

function deleteScript(name){

scripts=scripts.filter(s=>s!==name)
updateList()

}

</script>

</body>
</html>
